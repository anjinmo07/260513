<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone Dodger - Theme Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; background-color: #020617; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="flex items-center justify-center h-screen transition-colors duration-500">
    <!-- 게임이 그려질 캔버스 엘리먼트 (이 부분이 있어야 getContext 에러가 나지 않습니다) -->
    <canvas id="gameCanvas" class="absolute inset-0"></canvas>

    <!-- UI 레이어 -->
    <div id="ui-overlay" class="absolute inset-0 z-10 flex flex-col items-center justify-between py-10 pointer-events-none">
        
        <!-- 테마 토글 버튼 (클릭 가능하도록 pointer-events-auto 설정) -->
        <div class="absolute top-5 right-5 pointer-events-auto">
            <button id="theme-toggle" class="p-3 rounded-full bg-slate-800 text-white hover:bg-slate-700 transition-all shadow-lg border border-slate-600">
                <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 9H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </div>

        <div class="text-center">
            <h1 id="game-title" class="text-xl font-black tracking-tighter opacity-30 uppercase transition-colors text-white">Stone Dodger</h1>
            <div id="score-text" class="text-6xl font-black text-white">0</div>
        </div>

        <!-- 시작/결과 화면 -->
        <div id="message-screen" class="pointer-events-auto bg-slate-900/80 backdrop-blur-md p-8 rounded-3xl border border-white/10 text-center shadow-2xl max-w-sm w-full mx-4">
            <h2 id="msg-title" class="text-4xl font-black text-white mb-2">STONE DODGER</h2>
            <p id="msg-desc" class="text-slate-400 mb-6 text-sm">Avoid falling asteroids as long as you can.</p>
            <button id="start-btn" class="w-full bg-sky-500 hover:bg-sky-400 text-white font-bold py-4 rounded-2xl transition-all transform active:scale-95 shadow-lg shadow-sky-500/20">
                START MISSION
            </button>
        </div>
        
        <div class="text-slate-500 text-xs font-medium tracking-widest uppercase">
            Move mouse or touch to dodge
        </div>
    </div>

    <script>
        window.onload = function() {
            const canvas = document.getElementById('gameCanvas');
            if (!canvas) return; // 캔버스를 찾을 수 없으면 중단
            
            const ctx = canvas.getContext('2d');
            const scoreText = document.getElementById('score-text');
            const messageScreen = document.getElementById('message-screen');
            const msgTitle = document.getElementById('msg-title');
            const msgDesc = document.getElementById('msg-desc');
            const startBtn = document.getElementById('start-btn');
            const themeBtn = document.getElementById('theme-toggle');
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');
            const gameTitle = document.getElementById('game-title');

            let width, height;
            let score = 0;
            let isPlaying = false;
            let animationId;
            let lastTime = 0;
            let shakeTime = 0;
            
            let isDarkMode = true;
            const colors = {
                dark: {
                    bg: '#020617',
                    star: 'rgba(255, 255, 255, 0.3)',
                    player: '#38bdf8',
                    stone: '#1e293b',
                    stoneStroke: '#94a3b8',
                    text: 'text-white'
                },
                light: {
                    bg: '#f8fafc',
                    star: 'rgba(15, 23, 42, 0.1)',
                    player: '#0284c7',
                    stone: '#cbd5e1',
                    stoneStroke: '#475569',
                    text: 'text-slate-900'
                }
            };

            const config = {
                playerSize: 25,
                stoneBaseSpeed: 3,
                spawnRate: 800,
                minSpawnRate: 200,
                particleCount: 15
            };

            let player = { x: 0, y: 0, targetX: 0, targetY: 0 };
            let stones = [];
            let particles = [];
            let stars = [];

            themeBtn.onclick = () => {
                isDarkMode = !isDarkMode;
                if (isDarkMode) {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                    themeBtn.className = "p-3 rounded-full bg-slate-800 text-white hover:bg-slate-700 transition-all shadow-lg border border-slate-600";
                    gameTitle.className = "text-xl font-black tracking-tighter opacity-30 uppercase transition-colors text-white";
                    scoreText.className = "text-6xl font-black text-white";
                } else {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                    themeBtn.className = "p-3 rounded-full bg-white text-orange-500 hover:bg-orange-50 transition-all shadow-lg border border-orange-200";
                    gameTitle.className = "text-xl font-black tracking-tighter opacity-30 uppercase transition-colors text-slate-900";
                    scoreText.className = "text-6xl font-black text-slate-900";
                }
                draw();
            };

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                
                if (!isPlaying) {
                    player.x = width / 2;
                    player.y = height * 0.8;
                    player.targetX = player.x;
                    player.targetY = player.y;
                }
                
                stars = [];
                for(let i = 0; i < 100; i++) {
                    stars.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        size: Math.random() * 2,
                        speed: Math.random() * 0.5 + 0.1
                    });
                }
            }

            function handleInput(e) {
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                if (x !== undefined) {
                    player.targetX = x;
                    player.targetY = y;
                }
            }

            window.addEventListener('resize', resize);
            window.addEventListener('mousemove', handleInput);
            window.addEventListener('touchmove', (e) => {
                e.preventDefault();
                handleInput(e);
            }, { passive: false });

            function spawnStone() {
                if (!isPlaying) return;
                
                const size = 20 + Math.random() * 40;
                const speed = config.stoneBaseSpeed + (score / 15);
                
                stones.push({
                    x: Math.random() * width,
                    y: -size,
                    width: size,
                    height: size,
                    speed: speed,
                    rotation: 0,
                    rotSpeed: (Math.random() - 0.5) * 0.1,
                    points: generateJaggedPoints(size)
                });

                const nextSpawn = Math.max(config.minSpawnRate, config.spawnRate - (score * 5));
                setTimeout(spawnStone, nextSpawn);
            }

            function generateJaggedPoints(size) {
                const points = [];
                const segments = 8;
                for(let i = 0; i < segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    const dist = (size / 2) * (0.8 + Math.random() * 0.4);
                    points.push({ x: Math.cos(angle) * dist, y: Math.sin(angle) * dist });
                }
                return points;
            }

            function createExplosion(x, y, color) {
                for(let i = 0; i < config.particleCount; i++) {
                    particles.push({
                        x, y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        size: Math.random() * 4 + 2,
                        life: 1,
                        color: color
                    });
                }
                shakeTime = 15;
            }

            function startGame() {
                score = 0;
                stones = [];
                particles = [];
                isPlaying = true;
                
                messageScreen.classList.add('hidden');
                themeBtn.classList.add('hidden'); // 테마 버튼 숨기기
                
                scoreText.innerText = '0';
                player.x = width / 2;
                player.y = height * 0.8;
                spawnStone();
                lastTime = performance.now();
                animate();
            }

            function gameOver() {
                isPlaying = false;
                cancelAnimationFrame(animationId);
                createExplosion(player.x, player.y, '#ef4444');
                
                setTimeout(() => {
                    msgTitle.innerText = "MISSION FAILED";
                    msgDesc.innerText = `You dodged ${score} asteroids.`;
                    startBtn.innerText = "RETRY MISSION";
                    
                    messageScreen.classList.remove('hidden');
                    themeBtn.classList.remove('hidden'); // 테마 버튼 다시 보이기
                }, 500);
            }

            startBtn.onclick = startGame;

            function update() {
                if (!isPlaying) return;

                player.x += (player.targetX - player.x) * 0.15;
                player.y += (player.targetY - player.y) * 0.15;

                for(let i = stones.length - 1; i >= 0; i--) {
                    const s = stones[i];
                    s.y += s.speed;
                    s.rotation += s.rotSpeed;

                    const dx = player.x - s.x;
                    const dy = player.y - s.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < (config.playerSize / 2 + s.width / 2) - 5) {
                        gameOver();
                    }

                    if (s.y > height + s.height) {
                        stones.splice(i, 1);
                        score++;
                        scoreText.innerText = score;
                    }
                }

                for(let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > height) star.y = 0;
                });

                if (shakeTime > 0) shakeTime--;
            }

            function draw() {
                const theme = isDarkMode ? colors.dark : colors.light;
                
                ctx.fillStyle = theme.bg;
                ctx.fillRect(0, 0, width, height);

                ctx.save();
                if (shakeTime > 0) {
                    ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
                }

                // 별 그리기
                ctx.fillStyle = theme.star;
                stars.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 돌 그리기
                stones.forEach(s => {
                    ctx.save();
                    ctx.translate(s.x, s.y);
                    ctx.rotate(s.rotation);
                    ctx.beginPath();
                    ctx.moveTo(s.points[0].x, s.points[0].y);
                    for(let i = 1; i < s.points.length; i++) ctx.lineTo(s.points[i].x, s.points[i].y);
                    ctx.closePath();
                    ctx.fillStyle = theme.stone;
                    ctx.strokeStyle = theme.stoneStroke;
                    ctx.lineWidth = 2;
                    ctx.fill();
                    ctx.stroke();
                    ctx.restore();
                });

                // 파티클 그리기
                particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // 플레이어 그리기
                if (isPlaying) {
                    ctx.save();
                    ctx.translate(player.x, player.y);
                    if (isDarkMode) {
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = theme.player;
                    }
                    ctx.fillStyle = theme.player;
                    ctx.beginPath();
                    ctx.moveTo(0, -config.playerSize);
                    ctx.lineTo(config.playerSize/1.5, config.playerSize/1.5);
                    ctx.lineTo(-config.playerSize/1.5, config.playerSize/1.5);
                    ctx.closePath();
                    ctx.fill();
                    
                    // 엔진 불꽃
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.moveTo(-5, config.playerSize/1.5);
                    ctx.lineTo(5, config.playerSize/1.5);
                    ctx.lineTo(0, config.playerSize/1.5 + (Math.random() * 15 + 5));
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore();
            }

            function animate(time) {
                update();
                draw();
                if (isPlaying || particles.length > 0) {
                    animationId = requestAnimationFrame(animate);
                }
            }

            resize();
            draw();
        };
    </script>
</body>
</html>
